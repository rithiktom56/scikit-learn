import random
from sklearn.linear_model import LogisticRegression
import numpy as np

# Function to classify period number as "Big" or "Small"
def classify_period_number(period_number):
    if 0 <= period_number <= 4:
        return 0  # Small
    elif 5 <= period_number <= 9:
        return 1  # Big
    else:
        raise ValueError("Invalid period number")

# Function to prepare training data
def prepare_training_data(results):
    X = []
    y = []
    for i in range(len(results) - 5):
        X.append(results[i:i+5])
        y.append(classify_period_number(results[i+5]))
    return np.array(X), np.array(y)

# Function to predict the next result based on the last 5 results
def predict_next_result(model, last_results):
    prediction = model.predict([last_results])
    return "Big" if prediction[0] == 1 else "Small"

def main():
    # Example historical data (should be replaced with real data)
    historical_results = [random.randint(0, 9) for _ in range(100)]
    
    # Prepare training data
    X, y = prepare_training_data(historical_results)
    
    # Train the model
    model = LogisticRegression()
    model.fit(X, y)
    
    # Get the last 5 results from user input
    last_results = []
    for i in range(5):
        while True:
            try:
                period_number = int(input(f"Enter result number {i+1} (0-9): "))
                if 0 <= period_number <= 9:
                    last_results.append(period_number)
                    break
                else:
                    print("Invalid period number. Please enter a number between 0 and 9.")
            except ValueError:
                print("Invalid input. Please enter an integer between 0 and 9.")
    
    # Predict the next result
    prediction = predict_next_result(model, last_results)
    print(f"The prediction for the next period is: {prediction}")

if __name__ == "__main__":
    main()
    
    
